name: Cross-platform checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.18.0"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Verify the committed portable HTML
        run: git diff --exit-code -- 打开帧序.html
      - name: Install the test browser
        run: npx --no-install playwright install --with-deps chromium --only-shell
      - name: Test offline file-based annotation and export
        run: npm run smoke:portable
      - name: Smoke-test the startup command
        run: npm run smoke
      - name: Check formatting
        run: npm run format:check
      - name: Save browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: artifacts/portable-smoke
          if-no-files-found: ignore
